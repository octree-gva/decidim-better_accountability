##
# Set of re-usable rules for decidim module development.
# You are required to set the following CI/CD variables:
#
# - CROWDIN_PERSONAL_TOKEN: protected & masked. // Crowdin API token (group-level OK)
# - CROWDIN_PROJECT_ID: masked. // Crowdin project id
# - GEM_HOST_API_KEY: protected & masked. //
#
# GitLab UI (once per project): Settings → CI/CD → Job token permissions →
# enable "Allow Git push requests to the repository" (off by default).
# crowdin::merge_request pushes with CI_JOB_TOKEN (no TRANSLATIONBOT_* vars).
stages:
  - lint
  - test
  - translate
  - publish
variables:
  POSTGRES_DB: decidim_test
  POSTGRES_USER: decidim
  POSTGRES_PASSWORD: "TEST-insecure_password"

services:
  - postgres:17
  - redis:latest

.development_rules:  
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
.publication_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
##
# Lint ruby code
ruby::rubocop:  
  extends: .development_rules
  image: ruby:3.4.7
  stage: lint
  script:
    - bundle
    - bundle exec rubocop .
##
# Execute rspec (parity with docker-compose.ci.yml). No extra linters/Chrome.
ruby::rspec:
  image: ruby:3.4.7
  stage: test
  extends: .development_rules
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
  variables:
    DATABASE_HOST: "postgres"
    DATABASE_PASSWORD: "TEST-insecure_password"
    DATABASE_USERNAME: "decidim"
    DISABLED_DOCKER_COMPOSE: "true"
    DISABLE_SPRING: "1"
    TRAEFIK_REDIS_URL: "redis://localhost:6379/1"
    SIMPLECOV: 1
    CI: 1
  before_script:
    # ruby-vips (Active Storage / Decidim) needs libvips; Debian nodejs is Node 20 and
    # breaks shakapacker file:packages/*. Use NodeSource 22 + libvips42 before rake test_app.
    - apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg libvips42
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq nodejs
    - corepack enable
    - corepack prepare yarn@1.22.22 --activate
    - gem install bundler
    - bundle config set path 'vendor'
    - RAILS_ENV=development bundle install -j $(nproc)
    - bundle exec rake test_app
  script:
    - RAILS_ENV=test bundle exec rspec spec
##
# Check Crowdin connectivity (credentials via CI vars; crowdin.yml keeps placeholders)
crowdin::lint:  
  extends: .development_rules
  image: node:22
  stage: lint
  script:
    - npm install -g @crowdin/cli
    - crowdin status -T $CROWDIN_PERSONAL_TOKEN -i $CROWDIN_PROJECT_ID --no-progress
  allow_failure: true
##
# Publish the gem un ruby gem.
ruby::rubygem:
  image: ruby:3.4.7
  stage: publish
  script:
    - echo "---" > .credentials
    - |
      echo ":ci_rubygems_api_key: $GEM_HOST_API_KEY" >> .credentials
    - chmod 0600 .credentials
    - gem build decidim-decidim_better_accountability.gemspec
    - gem push decidim-decidim_better_accountability-*.gem -k ci_rubygems_api_key --config-file .credentials
  only:
    - tags
##
# Upload new translation keys to crowdin
crowdin::upload:
  stage: translate
  image: node:22
  script:
    - npm install -g @crowdin/cli
    - crowdin upload -T $CROWDIN_PERSONAL_TOKEN -i $CROWDIN_PROJECT_ID --no-progress
    - crowdin status -T $CROWDIN_PERSONAL_TOKEN -i $CROWDIN_PROJECT_ID --no-progress
  when: manual
##
# Create a Merge request in the project with updated
# crowdin translations (push via CI_JOB_TOKEN + push options).
crowdin::merge_request:
  stage: translate
  image: node:22
  extends: .publication_rules
  before_script:
    - apt-get update && apt-get install -y git
  script:
    - git config --global user.email "translations@noreply"
    - git config --global user.name "crowdin-ci"
    - npm install -g @crowdin/cli
    - crowdin download -T $CROWDIN_PERSONAL_TOKEN -i $CROWDIN_PROJECT_ID --no-progress
    - crowdin status -T $CROWDIN_PERSONAL_TOKEN -i $CROWDIN_PROJECT_ID --no-progress
    - export BRANCH_NAME="i18n/$(date +%Y%m%d%H%M%S)"
    - export ORIGIN="crowdin_$(date +%Y%m%d%H%M%S)"
    - echo "add remote $ORIGIN user=gitlab-ci-token path=$CI_PROJECT_PATH host=$CI_SERVER_HOST"
    - git remote add $ORIGIN "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git checkout -b $BRANCH_NAME
    - git add config/locales
    - |
      if git diff --cached --quiet; then
        echo "No locale changes; skipping commit/push."
        exit 0
      fi
    - git commit -m "Crowdin Updates"
    - git push $ORIGIN HEAD:$BRANCH_NAME -o merge_request.create -o merge_request.target=main