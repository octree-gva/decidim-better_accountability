services:
  decidim-better-acccountability:
    container_name: decidim-better-acccountability
    command: bash -c "sleep infinity"
    image: octree/decidim-dev:0.32
    entrypoint: ""
    volumes:
      - .:/home/module
      - bundle:/home/decidim/vendor
      - node_modules:/home/decidim/node_modules
    environment:
      - PORT=3000
      - DATABASE_HOST=pg
      - DATABASE_USERNAME=decidim
      - DATABASE_PASSWORD=pleaseChangeMe
      - DATABASE_URL=postgresql://decidim:pleaseChangeMe@better-accountability-pg:5432/decidim
      - DEV_MODULE=decidim-decidim_better_accountability
      - RAILS_ENV=development
      - DECIDIM_FORCE_SSL=false
      - DISABLE_SPRING=1
    ports:
      - 3000:3000
    depends_on:
      better-accountability-pg:
        condition: service_healthy

  better-accountability-pg:
    container_name: better-accountability-pg
    image: postgres:17
    volumes:
      - better-acccountability-pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DATABASE=decidim
      - POSTGRES_USER=decidim
      - POSTGRES_PASSWORD=pleaseChangeMe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decidim"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  node_modules: {}
  bundle: {}
  better-acccountability-pg-data: {}
