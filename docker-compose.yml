services:
  # Install deps, and execute a rubocop auto-fix.
  rubocop: 
    image: ruby:3.0.7
    working_dir: /root
    volumes:
      - .:/root
      - bundle:/root/vendor
    command: bundle && bundle exec rubocop -A .

  better_accountability:
    command: bash -c "sleep infinity"
    image: octree/decidim-dev:0.27
    entrypoint: ""
    volumes:
      - .:/home/decidim/module
      - bundle:/home/decidim/app/vendor
      - node_modules:/home/decidim/app/node_modules
    environment:
      - PORT=3000
      - DATABASE_HOST=pg
      - DATABASE_USERNAME=decidim
      - DATABASE_PASSWORD=pleaseChangeMe
      - DATABASE_URL=postgresql://decidim:pleaseChangeMe@better-accountability-pg:5432/decidim
      - DEV_MODULE=decidim-decidim_better_accountability
      - RAILS_ENV=development
    ports:
      - 3000:3000
    depends_on:
      - rubocop
    links:
      - better-accountability-pg

  better-accountability-pg:
    image: postgres:15
    volumes:
      - better_accountability-pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DATABASE=decidim
      - POSTGRES_USER=decidim
      - POSTGRES_PASSWORD=pleaseChangeMe

volumes:
  node_modules: {}
  bundle: {}
  better_accountability-pg-data: {}
